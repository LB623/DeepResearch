[project]
name = "DeepResearch"
version = "0.0.1"
description = "基于LangGraph的后端Agent"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langgraph>=1.2.5,<2",
    "langchain>=1.3.9,<2",
    "openai>=2.41.1,<3",
    "python-dotenv>=1.2.2,<2",
    "langgraph-sdk>=0.4.2,<1",
    "langgraph-cli>=0.4.29,<1",
    "langgraph-api>=0.10.0,<1",
    "langgraph-checkpoint-redis>=0.4.1,<1",
    "fastapi>=0.137.1,<1",
    "dashscope>=1.25.21,<2",
    "pymilvus>=3.0.0,<4",
    "loguru>=0.7.3,<1",
    "redis>=7.4.1,<8",
    "requests>=2.34.2,<3",
    "pydantic>=2.13.4,<3",
]


[project.optional-dependencies]
dev = [
    "mypy>=1.11.1",
    "ruff>=0.6.1",
    "langgraph-cli[inmem]>=0.1.71",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"test/*" = ["UP"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (sub-graph level)",
]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["dashscope", "pymilvus", "pymilvus.*"]
ignore_missing_imports = true
